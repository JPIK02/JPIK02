<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- barre d'état fondue dans la bande bleu nuit du haut (voir --edge dans styles.css pour le voile flou d'iOS) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lamaelle">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Lamaelle</title>
<script>/* thème choisi dans Réglages, appliqué avant l'affichage pour éviter un flash */try{var t=localStorage.getItem("mariage-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<!-- zone de défilement : dans l'app installée, la page défile ici, sous la bande du haut (voir styles.css) -->
<div id="scroller">
<header class="hero">
  <div class="wrap hero-in">
    <div class="hero-top">
      <div class="brand-row">
        <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="#F7F3EC" stroke-width="2.4"/><circle cx="60" cy="62" r="26" fill="none" stroke="#D98C6A" stroke-width="7"/><path d="M60 32 L32 25 M60 32 L88 25" fill="none" stroke="#C9A46A" stroke-width="1.8" stroke-linecap="round"/><polygon points="54.5,90 65.5,90 63.5,41 56.5,41" fill="#F7F3EC"/><rect x="55.5" y="31" width="9" height="10" fill="#F7F3EC"/><polygon points="54,31 66,31 60,23" fill="#F7F3EC"/><path d="M24 90 L96 90 M34 97 L86 97 M46 104 L74 104" fill="none" stroke="#F7F3EC" stroke-width="2.4" stroke-linecap="round"/></svg>
        <div style="min-width:0">
          <div class="brand-name">Lamaelle</div>
          <h1 class="names" id="names"></h1>
          <div class="hero-sub" id="hero-sub"></div>
        </div>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="frieze" id="frieze"></div>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="wrap tabs-in" id="tabs"></div>
</nav>
<main class="wrap" id="main"></main>
</div>
<nav class="bnav" id="bnav" aria-label="Navigation"></nav>
<button class="fab" id="fab" data-act="chat" aria-label="Ouvrir le coach mariage (IA)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.9L19 9.7l-4.6 2.6L12 21l-2.4-8.7L5 9.7l5.2-1.8z"/></svg><span>Coach</span></button>
<div id="layer"></div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
