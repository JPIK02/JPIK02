name: Journaux du coach (erreurs)

# Lit les erreurs récentes des fonctions Google (assistant, runAgent, agents) pour diagnostiquer
# un « Le coach ne répond pas ». Lecture seule. Lancement manuel, ou automatique quand ce fichier change.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Remonter sur combien d'heures"
        default: "24"
      all:
        description: "Tous les messages (pas seulement les erreurs) : oui/non"
        default: "non"
  push:
    branches: [claude/cool-cori-ipe48i]
    paths: [".github/workflows/logs.yml"]

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Erreurs des fonctions
        env:
          HOURS: ${{ inputs.hours || '24' }}
          ALL: ${{ inputs.all || 'non' }}
        run: |
          SINCE=$(date -u -d "-${HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=(\"assistant\" OR \"runagent\" OR \"agents\") $([ "$ALL" = "oui" ] || echo 'AND severity>=WARNING') AND timestamp>=\"$SINCE\"" \
            --limit 120 --order desc \
            --format 'value(timestamp, resource.labels.service_name, severity, textPayload, jsonPayload.message, httpRequest.status)' \
            | cut -c1-1500
