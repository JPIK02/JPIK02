name: Copie des secrets vers lamaelle
# Usage unique (déménagement vers le dépôt JPIK02/lamaelle) : recopie les secrets et variables des workflows dans le nouveau
# dépôt, sans jamais les afficher (seuls les noms apparaissent). Nécessite le secret LAMAELLE_TOKEN (jeton à durée limitée,
# droits Secrets et Variables en écriture sur lamaelle seulement), à supprimer ensuite avec ce fichier.
on:
  push:
    branches: [claude/cool-cori-ipe48i]
    paths: [".github/workflows/copie-secrets.yml"]
  workflow_dispatch:
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copie
        env:
          GH_TOKEN: ${{ secrets.LAMAELLE_TOKEN }}
          S_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          S_GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          S_GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          S_GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          V_ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          V_COUPLE_EMAILS: ${{ vars.COUPLE_EMAILS }}
          V_COMPTES_AUTORISES: ${{ vars.COMPTES_AUTORISES }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret LAMAELLE_TOKEN manquant dans JPIK02/JPIK02"; exit 1; fi
          R=JPIK02/lamaelle; ok=0; ko=0
          for n in FIREBASE_SERVICE_ACCOUNT ANTHROPIC_API_KEY GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN; do
            v=$(printenv "S_$n" || true)
            if [ -z "$v" ]; then echo "secret $n : absent ici, non copié"; continue; fi
            if printf '%s' "$v" | gh secret set "$n" --repo "$R" >/dev/null 2>&1; then echo "secret $n : copié"; ok=$((ok+1)); else echo "::error::secret $n : échec"; ko=$((ko+1)); fi
          done
          for n in ANTHROPIC_MODEL COUPLE_EMAILS COMPTES_AUTORISES; do
            v=$(printenv "V_$n" || true)
            if [ -z "$v" ]; then echo "variable $n : absente ici, non copiée"; continue; fi
            if gh variable set "$n" --repo "$R" --body "$v" >/dev/null 2>&1; then echo "variable $n : copiée"; ok=$((ok+1)); else echo "::error::variable $n : échec"; ko=$((ko+1)); fi
          done
          echo "Copiés : $ok · échecs : $ko"
          [ "$ko" = 0 ]
