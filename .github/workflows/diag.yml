name: Diagnostic briefs
# Lecture seule : affiche le début de chaque brief prestataire enregistré.
on:
  workflow_dispatch:
  push:
    branches: [claude/cool-cori-ipe48i]
    paths: [".github/workflows/diag.yml", "mariage-app/agents/diag-briefs.js"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mariage-app/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node diag-briefs.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
