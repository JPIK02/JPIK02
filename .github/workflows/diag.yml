name: Diagnostic briefs
# Lecture seule : affiche le début de chaque brief prestataire enregistré.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Diagnostic"
        type: choice
        options: ["briefs", "ecawee"]
        default: "briefs"
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mariage-app/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: if [ "${{ inputs.cible }}" = "ecawee" ]; then node diag-vendor.js ecaw; else node diag-briefs.js; fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
