name: Diagnostic briefs
# Diagnostics en lecture seule (briefs, ecawee, envies), et migration de « Nos envies » :
# « migration-simulation » n'écrit rien ; « migration-ecrire » sauvegarde tout puis migre (voir agents/migrate-envies.js).
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Diagnostic"
        type: choice
        options: ["briefs", "ecawee", "envies", "migration-simulation", "migration-ecrire", "tailles"]
        default: "briefs"
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mariage-app/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: if [ "${{ inputs.cible }}" = "ecawee" ]; then node diag-vendor.js ecaw; elif [ "${{ inputs.cible }}" = "envies" ]; then node diag-envies.js; elif [ "${{ inputs.cible }}" = "migration-simulation" ]; then node migrate-envies.js; elif [ "${{ inputs.cible }}" = "migration-ecrire" ]; then node migrate-envies.js ecrire; elif [ "${{ inputs.cible }}" = "tailles" ]; then node diag-tailles.js; else node diag-briefs.js; fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
