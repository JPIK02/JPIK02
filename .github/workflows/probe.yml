name: Test du flux Pinterest
# Vérifie qu'un tableau Pinterest public expose bien son flux RSS (diagnostic, lecture seule).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien du flux (…/tableau.rss)"
        default: "https://www.pinterest.com/pinterest/official-news.rss"
  push:
    branches: [claude/cool-cori-ipe48i]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          URL: ${{ inputs.url || 'https://www.pinterest.com/pinterest/official-news.rss' }}
        run: |
          for u in "$URL" "https://www.pinterest.com/pinterest/feed.rss"; do
            echo "== $u"
            curl -sSL -m 30 -A "Mozilla/5.0 (compatible; MariageApp/1.0)" -o f.xml -w "HTTP %{http_code} %{content_type}\n" "$u" || true
            head -c 1500 f.xml | sed 's/></>\n</g' | head -40; echo
            echo "items: $(grep -o '<item>' f.xml | wc -l)  images: $(grep -o 'i.pinimg.com[^"]*' f.xml | head -3)"
          done
